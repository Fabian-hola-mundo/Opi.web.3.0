<main id="main-content" aria-label="Página principal OPI Technology">
  <!-- Skip-link target -->
  <a href="#main-content" class="sr-only skip-link">Saltar al contenido principal</a>

  <!-- Header -->
  <app-header />

  <!-- Theme toggle button (top-right) -->
  <button
    class="theme-toggle"
    (click)="themeService.toggle()"
    [attr.aria-label]="themeService.theme() === 'dark' ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro'"
    [attr.title]="themeService.theme() === 'dark' ? 'Modo claro' : 'Modo oscuro'"
  >
    @if (themeService.theme() === 'dark') {
      <!-- Sun icon -->
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
      </svg>
    } @else {
      <!-- Moon icon -->
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
      </svg>
    }
  </button>

  <!-- HERO: SSR, above the fold, always renders -->
  <app-hero />

  <!-- SOCIAL PROOF: defer until viewport -->
  @defer (on viewport) {
    <app-social-proof />
  } @placeholder {
    <div class="section-placeholder" aria-hidden="true" style="min-height: 200px;"></div>
  }

  <!-- PAIN BLOCK: defer until viewport -->
  @defer (on viewport) {
    <app-pain-block />
  } @placeholder {
    <div class="section-placeholder" aria-hidden="true" style="min-height: 400px;"></div>
  }

  <!-- BRIDGE: defer until viewport -->
  @defer (on viewport) {
    <app-bridge />
  } @placeholder {
    <div class="section-placeholder" aria-hidden="true" style="min-height: 400px;"></div>
  }

  <!-- METRICS: defer until viewport -->
  @defer (on viewport) {
    <app-metrics />
  } @placeholder {
    <div class="section-placeholder" aria-hidden="true" style="min-height: 300px;"></div>
  }

  <!-- CONTACT: defer until viewport -->
  @defer (on viewport) {
    <app-contact-section />
  } @placeholder {
    <div class="section-placeholder" aria-hidden="true" style="min-height: 400px;"></div>
  }

  <!-- FOOTER: defer until viewport -->
  @defer (on viewport) {
    <app-footer />
  } @placeholder {
    <div class="section-placeholder" aria-hidden="true" style="min-height: 200px;"></div>
  }

  <!-- FAB: always visible -->
  <contact-fab />
</main>
