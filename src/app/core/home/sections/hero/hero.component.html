<section class="hero" [attr.aria-label]="lang.translations().hero.sectionAriaLabel">
  <div class="hero__canvas" appHeroParticles></div>
  <div class="hero__content container">
    <div class="hero__logo-wrapper">
      <img src="assets/images/logos/OpiLogo_horizontal_negativo.svg" alt="OPI Technology" class="hero__logo" />
    </div>
    <h1 class="display-lg hero__headline">
      {{ lang.translations().hero.headline }}
      <span class="text-gradient">{{ lang.translations().hero.headlineGradient }}</span>
    </h1>
    <p class="body-lg hero__subtitle">
      {{ lang.translations().hero.subtitle }}
    </p>
    <div class="hero__ctas">
      <opi-button
        [label]="lang.translations().hero.cta"
        variant="primary"
        href="/servicios"
      />
    </div>
  </div>
</section>
