<section class="social-proof" [attr.aria-label]="lang.translations().socialProof.sectionAriaLabel">
  <p class="social-proof__tagline">{{ lang.translations().socialProof.tagline }}</p>
  <div
    #carousel
    class="social-proof__track"
    role="list"
    [attr.aria-label]="lang.translations().socialProof.logosAriaLabel"
  >
    @for (logo of logos; track logo.src) {
      <div class="social-proof__tile" role="listitem">
        <div class="social-proof__logo-wrap">
          <img [ngSrc]="logo.src" [alt]="logo.alt" fill />
        </div>
      </div>
    }
  </div>
</section>
