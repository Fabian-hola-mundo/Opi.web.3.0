<section class="social-proof" aria-label="Empresas que confían en OPI Technology">
  <p class="social-proof__tagline">Empresas que confían en OPI Technology</p>
  <div
    #carousel
    class="social-proof__track"
    role="list"
    aria-label="Logos de clientes"
  >
    @for (logo of logos; track logo.src) {
      <div class="social-proof__tile" role="listitem">
        <div class="social-proof__logo-wrap">
          <img [ngSrc]="logo.src" [alt]="logo.alt" fill />
        </div>
      </div>
    }
  </div>
</section>
