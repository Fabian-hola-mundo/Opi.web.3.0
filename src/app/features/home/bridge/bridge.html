<div class="bridge-inner">
  <div class="container">

    <!-- Eyebrow -->
    <p class="bridge-eyebrow" aria-hidden="true">La diferencia</p>

    <!-- Main statement — gains "clarity" as user scrolls into view -->
    <h2 class="bridge-statement" aria-label="OPI asume lo que otros evitan.">
      OPI asume lo que
      <span class="bridge-statement__break"> </span>
      <em class="bridge-statement__accent">otros evitan.</em>
    </h2>

    <!-- Supporting copy -->
    <p class="bridge-copy">
      No vendemos implementaciones. Entregamos resultados verificables. Cada proyecto
      lleva el peso de más de una década operando en entornos donde el margen de
      error es prácticamente cero.
    </p>

    <!-- CTA -->
    <a class="bridge-cta"
       [routerLink]="['/']"
       fragment="contacto"
       aria-label="Hablar con OPI sobre tu proyecto">
      Hablemos de tu proyecto
    </a>

  </div>

  <!-- Decorative gradient orb — CSS only, aria-hidden -->
  <div class="bridge-orb bridge-orb--left" aria-hidden="true"></div>
  <div class="bridge-orb bridge-orb--right" aria-hidden="true"></div>
</div>
